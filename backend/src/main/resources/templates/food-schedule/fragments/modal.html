<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="modals">
        <!-- Add/Edit Modal -->
        <div class="modal fade" id="addScheduleModal" tabindex="-1" aria-labelledby="addScheduleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 shadow">
                    <form th:action="@{/food-schedule/save}" method="post" id="scheduleForm">
                        <div class="modal-header bg-light border-bottom-0 py-3">
                            <h5 class="modal-title fw-bold" id="addScheduleModalLabel">
                                <i class="bi bi-calendar-plus text-primary me-2"></i><span id="modalTitleText">Add Food Schedule</span>
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body p-4">
                            <input type="hidden" id="scheduleId" name="id">
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Meal Date <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="mealDate" name="mealDate" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Meal Type <span class="text-danger">*</span></label>
                                    <select class="form-select" id="mealType" name="mealType" required>
                                        <option value="">Select Meal Type</option>
                                        <option th:each="type : ${T(com.oldagehome.portal.foodschedule.MealType).values()}"
                                                th:value="${type}" th:text="${type.displayName}"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-muted">Menu Items <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="menuItems" name="menuItems" rows="3" placeholder="e.g., Dal, Rice, Sabji, Roti..." required></textarea>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-muted">Food Sponsor (Optional)</label>
                                    <select class="form-select" id="donorId" name="donorId">
                                        <option value="">No Sponsor</option>
                                        <option th:each="sponsor : ${sponsors}"
                                                th:value="${sponsor.donorId}" 
                                                th:text="${sponsor.donorName + ' - ₹' + sponsor.donationAmount + ' (' + #temporals.format(sponsor.donationDate, 'dd MMM yyyy') + ')'}"></option>
                                    </select>
                                    <div class="form-text">Only active Cash Food Donations with Amount > 0 are shown.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small text-muted">Status</label>
                                    <select class="form-select" id="status" name="status">
                                        <option value="ACTIVE">Active</option>
                                        <option value="COMPLETED">Completed</option>
                                        <option value="CANCELLED">Cancelled</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-muted">Remarks (Optional)</label>
                                    <textarea class="form-control" id="remarks" name="remarks" rows="2"></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer bg-light border-top-0 py-3">
                            <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4">Save Schedule</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- View Modal -->
        <div class="modal fade" id="viewScheduleModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-light border-bottom-0 py-3">
                        <h5 class="modal-title fw-bold">
                            <i class="bi bi-card-text text-primary me-2"></i>Schedule Details
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-6">
                                <span class="d-block small text-muted fw-bold mb-1">Date</span>
                                <div class="fw-medium" id="viewMealDate"></div>
                            </div>
                            <div class="col-6">
                                <span class="d-block small text-muted fw-bold mb-1">Meal Type</span>
                                <div class="fw-medium" id="viewMealType"></div>
                            </div>
                            <div class="col-12">
                                <span class="d-block small text-muted fw-bold mb-1">Menu Items</span>
                                <div class="p-3 bg-light rounded" id="viewMenuItems"></div>
                            </div>
                            <div class="col-12">
                                <span class="d-block small text-muted fw-bold mb-1">Food Sponsor</span>
                                <div id="viewDonorName"></div>
                            </div>
                            <div class="col-6">
                                <span class="d-block small text-muted fw-bold mb-1">Status</span>
                                <span class="badge bg-primary" id="viewStatus"></span>
                            </div>
                            <div class="col-12">
                                <span class="d-block small text-muted fw-bold mb-1">Remarks</span>
                                <div id="viewRemarks" class="text-muted small"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-top-0 py-3">
                        <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function editSchedule(id) {
                fetch('/food-schedule/api/item/' + id)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('scheduleId').value = data.id;
                        document.getElementById('mealDate').value = data.mealDate;
                        document.getElementById('mealType').value = data.mealType;
                        document.getElementById('menuItems').value = data.menuItems;
                        document.getElementById('donorId').value = data.donorId || '';
                        document.getElementById('status').value = data.status || 'ACTIVE';
                        document.getElementById('remarks').value = data.remarks || '';
                        
                        document.getElementById('modalTitleText').textContent = 'Edit Food Schedule';
                        
                        var editModal = new bootstrap.Modal(document.getElementById('addScheduleModal'));
                        editModal.show();
                    })
                    .catch(error => {
                        console.error('Error fetching schedule details:', error);
                        alert('Could not load schedule details. Please try again.');
                    });
            }

            function viewSchedule(id) {
                fetch('/food-schedule/api/item/' + id)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('viewMealDate').textContent = data.mealDate;
                        document.getElementById('viewMealType').textContent = data.mealType;
                        document.getElementById('viewMenuItems').textContent = data.menuItems;
                        document.getElementById('viewDonorName').textContent = data.donorName || 'No Sponsor';
                        
                        const statusBadge = document.getElementById('viewStatus');
                        statusBadge.textContent = data.status;
                        statusBadge.className = 'badge ' + (data.status === 'ACTIVE' ? 'bg-primary' : (data.status === 'COMPLETED' ? 'bg-success' : 'bg-secondary'));
                        
                        document.getElementById('viewRemarks').textContent = data.remarks || 'No remarks added.';
                        
                        var viewModal = new bootstrap.Modal(document.getElementById('viewScheduleModal'));
                        viewModal.show();
                    })
                    .catch(error => {
                        console.error('Error fetching schedule details:', error);
                        alert('Could not load schedule details. Please try again.');
                    });
            }
            
            // Reset form when Add modal is closed
            document.getElementById('addScheduleModal').addEventListener('hidden.bs.modal', function () {
                document.getElementById('scheduleForm').reset();
                document.getElementById('scheduleId').value = '';
                document.getElementById('modalTitleText').textContent = 'Add Food Schedule';
            });
        </script>
    </div>
</body>
</html>
