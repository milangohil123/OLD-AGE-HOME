<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="pagination(page, baseUrl, queryParams)">
    <div th:if="${page != null and page.totalElements > 0}">

        <div class="d-flex justify-content-between align-items-center px-4 py-3 flex-wrap gap-3"
             style="border-top: 1px solid #F3F4F6;">

            <!-- Left: summary + per-page -->
            <div class="d-flex align-items-center gap-4 flex-wrap">
                <span class="text-muted" style="font-size:13px;">
                    Showing
                    <strong class="text-dark" th:text="${page.number * page.size + 1}"></strong>
                    to
                    <strong class="text-dark"
                            th:text="${(page.number + 1) * page.size > page.totalElements
                                       ? page.totalElements
                                       : (page.number + 1) * page.size}"></strong>
                    of
                    <strong class="text-dark" th:text="${page.totalElements}"></strong>
                </span>

                <!-- Per-page selector -->
                <form method="get" th:attr="action=${baseUrl}" class="d-flex align-items-center gap-2">
                    <label class="text-muted mb-0" style="font-size:12px; white-space:nowrap;">Per page:</label>
                    <select name="size"
                            class="form-select form-select-sm"
                            style="width:auto; height:30px; font-size:12px; border-radius:6px; border:1px solid #E5E7EB; padding:0 8px;"
                            onchange="this.form.submit()">
                        <option value="5"  th:selected="${page.size == 5}">5</option>
                        <option value="10" th:selected="${page.size == 10}">10</option>
                        <option value="25" th:selected="${page.size == 25}">25</option>
                        <option value="50" th:selected="${page.size == 50}">50</option>
                        <option value="100" th:selected="${page.size == 100}">100</option>
                    </select>
                </form>
            </div>

            <!-- Right: page navigation -->
            <nav th:if="${page.totalPages > 1}" aria-label="Pagination">
                <ul class="pagination mb-0 gap-1">

                    <!-- Previous -->
                    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                        <a class="page-link"
                           th:if="${!page.first}"
                           th:href="${baseUrl} + '?page=' + (${page.number} - 1) + '&size=' + ${page.size}
                                    + (${queryParams != null and !queryParams.isEmpty()} ? '&' + ${queryParams} : '')"
                           style="padding: 0 12px; min-width: auto;">
                            <i class="bi bi-chevron-left" style="font-size:11px;"></i>
                        </a>
                        <span class="page-link" th:if="${page.first}"
                              style="padding: 0 12px; min-width: auto;">
                            <i class="bi bi-chevron-left" style="font-size:11px;"></i>
                        </span>
                    </li>

                    <!-- Page Numbers -->
                    <th:block th:each="pageNum : ${#numbers.sequence(0, page.totalPages - 1)}">
                        <th:block th:if="${pageNum < 2
                                          or pageNum >= page.totalPages - 2
                                          or (pageNum >= page.number - 1 and pageNum <= page.number + 1)}">
                            <li class="page-item" th:classappend="${pageNum == page.number} ? 'active'">
                                <a th:if="${pageNum != page.number}"
                                   class="page-link"
                                   th:href="${baseUrl} + '?page=' + ${pageNum} + '&size=' + ${page.size}
                                            + (${queryParams != null and !queryParams.isEmpty()} ? '&' + ${queryParams} : '')"
                                   th:text="${pageNum + 1}">1</a>
                                <span th:if="${pageNum == page.number}"
                                      class="page-link"
                                      th:text="${pageNum + 1}">1</span>
                            </li>
                        </th:block>
                        <!-- Ellipsis -->
                        <th:block th:if="${pageNum == 2 and page.totalPages > 5 and page.number > 3}">
                            <li class="page-item disabled">
                                <span class="page-link" style="border:none; background:transparent; color:#9CA3AF;">…</span>
                            </li>
                        </th:block>
                    </th:block>

                    <!-- Next -->
                    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                        <a class="page-link"
                           th:if="${!page.last}"
                           th:href="${baseUrl} + '?page=' + (${page.number} + 1) + '&size=' + ${page.size}
                                    + (${queryParams != null and !queryParams.isEmpty()} ? '&' + ${queryParams} : '')"
                           style="padding: 0 12px; min-width: auto;">
                            <i class="bi bi-chevron-right" style="font-size:11px;"></i>
                        </a>
                        <span class="page-link" th:if="${page.last}"
                              style="padding: 0 12px; min-width: auto;">
                            <i class="bi bi-chevron-right" style="font-size:11px;"></i>
                        </span>
                    </li>

                </ul>
            </nav>

        </div>
    </div>
</div>

</body>
</html>
