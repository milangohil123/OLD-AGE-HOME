<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Reusable Search Component — matches reference design -->
    <div th:fragment="search(baseUrl, keyword, size, sort, direction, placeholder)" class="mb-4">
        <div class="search-bar-wrap">
            <form th:attr="action=${baseUrl}" method="get">
                <div class="d-flex align-items-center gap-3 flex-wrap">

                    <!-- Search Input -->
                    <div class="search-input-group flex-grow-1" style="min-width: 220px;">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               th:value="${keyword}"
                               th:placeholder="${placeholder != null ? placeholder : 'Search records...'}"
                               aria-label="Search">
                        <input type="hidden" name="size"      th:value="${size}">
                        <input type="hidden" name="sort"      th:value="${sort}">
                        <input type="hidden" name="direction" th:value="${direction}">
                    </div>

                    <!-- Filters (visual only) + Search + Clear -->
                    <div class="d-flex gap-2 align-items-center flex-shrink-0">
                        <button type="button" class="btn btn-secondary"
                                style="height:42px; border:1.5px solid #E5E7EB; font-size:13px;">
                            <i class="bi bi-funnel me-1"></i>Filters
                        </button>
                        <button type="submit" class="btn btn-primary"
                                style="height:42px; min-width:100px; font-size:13px;">
                            <i class="bi bi-search me-1"></i>Search
                        </button>
                        <a th:if="${keyword != null and !keyword.isEmpty()}"
                           th:href="|${baseUrl}?size=${size}&sort=${sort}&direction=${direction}|"
                           class="btn btn-secondary"
                           style="height:42px; font-size:13px;">
                            <i class="bi bi-x-lg me-1"></i>Clear
                        </a>
                    </div>

                </div>
            </form>
        </div>
    </div>
</body>
</html>
