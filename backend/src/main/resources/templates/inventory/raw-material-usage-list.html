<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/layout :: main(~{::#usage-list-container}, 'usage-logs', 'Usage History')}">

<body>
    <div id="usage-list-container">
        <!-- ── Header & Action Buttons ── -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/inventory}" class="text-decoration-none text-muted small mb-2 d-inline-block">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{inventory.usage.back}">Back to Inventory</span>
                </a>
                <h4 class="mb-1 text-dark fw-bold" th:text="#{inventory.usage.title}">Usage History</h4>
                <p class="text-muted mb-0 small" th:text="#{inventory.usage.desc}">View historical usage of raw materials</p>
            </div>
            <div>
                <a th:href="@{/inventory/usage/new}" class="btn btn-primary fw-bold shadow-sm" style="border-radius: 8px; font-size: 14px;">
                    <i class="bi bi-plus-lg me-1"></i> <span th:text="#{inventory.usage.btn.new}">Log New Usage</span>
                </a>
            </div>
        </div>

        <!-- ── Search Form ── -->
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 12px;">
            <div class="card-body p-3">
                <form th:action="@{/inventory/usage}" method="get" class="row g-2 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted mb-1" th:text="#{inventory.usage.search.purpose}">Purpose</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" name="purpose" class="form-control border-start-0 ps-0" 
                                th:placeholder="#{inventory.usage.search.purpose.placeholder}" th:value="${purpose}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold text-muted mb-1" th:text="#{inventory.usage.search.date}">Date</label>
                        <input type="date" name="date" class="form-control" th:value="${date}">
                    </div>
                    <div class="col-md-auto">
                        <button type="submit" class="btn btn-dark fw-bold px-4" th:text="#{inventory.usage.search.filter}">Filter</button>
                        <a th:href="@{/inventory/usage}" class="btn btn-outline-secondary ms-1" th:text="#{inventory.usage.search.reset}">Reset</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- ── Main Table Card ── -->
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.usage.table.logid}">Log ID</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.usage.table.date}">Date</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.usage.table.purpose}">Purpose</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.usage.table.items}">Items Used</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:if="${usagesPage.empty}">
                            <td colspan="4" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                                <span th:text="#{inventory.usage.table.empty}">No usage history found.</span>
                            </td>
                        </tr>
                        <tr th:each="usage : ${usagesPage.content}">
                            <td class="px-4 py-3">
                                <span class="fw-bold text-dark" th:text="${'#LOG' + usage.id}"></span>
                            </td>
                            <td class="px-4 py-3">
                                <span class="badge bg-light text-dark border"><i class="bi bi-calendar3 me-1"></i> <span th:text="${#temporals.format(usage.usageDate, 'dd-MM-yyyy')}"></span></span>
                            </td>
                            <td class="px-4 py-3">
                                <span class="fw-bold text-primary" th:text="${usage.purpose}"></span>
                            </td>
                            <td class="px-4 py-3">
                                <ul class="list-unstyled mb-0 small">
                                    <li th:each="item : ${usage.items}" class="mb-1">
                                        <i class="bi bi-dot text-secondary"></i>
                                        <span th:text="${item.rawMaterial.itemName}" class="fw-semibold"></span>: 
                                        <span th:text="${item.quantityUsed}" class="text-danger fw-bold"></span> 
                                        <span th:text="${item.unit}" class="text-muted"></span>
                                    </li>
                                </ul>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${!usagesPage.empty}" class="card-footer bg-white border-0 py-3 px-4" style="border-radius: 0 0 12px 12px;">
                <div th:replace="~{fragments/pagination :: pagination(page=${usagesPage}, baseUrl='/inventory/usage', query=${paginationQuery})}"></div>
            </div>
        </div>
    </div>
</body>
</html>
