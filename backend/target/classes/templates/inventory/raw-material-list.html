<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/main}">

<head>
    <title th:text="#{inventory.raw.title} + ' - ' + #{app.title}">Raw Materials</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- ── Header & Add Button ── -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-1 text-dark fw-bold" th:text="#{inventory.raw.title}">Raw Materials</h4>
                <p class="text-muted mb-0 small" th:text="#{inventory.raw.desc}">Manage food and raw material inventory stock</p>
            </div>
            <div>
                <a th:href="@{/inventory/raw-materials/usage}" class="btn btn-primary fw-bold shadow-sm" style="border-radius: 8px; font-size: 14px;">
                    <i class="bi bi-journal-text me-1"></i> <span th:text="#{inventory.raw.btn.usage}">Log Usage</span>
                </a>
            </div>
        </div>

        <!-- ── Dashboard KPI Cards ── -->
        <div class="row g-3 mb-4">
            <!-- Total Items -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100" style="border-radius: 12px; border-left: 4px solid #0d6efd !important;">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted small mb-1 fw-semibold text-uppercase" th:text="#{inventory.raw.stat.total}">Total Items</p>
                                <h3 class="mb-0 fw-bold text-dark" th:text="${totalItems}">0</h3>
                            </div>
                            <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-box-seam text-primary fs-4"></i>
                            </div>
                        </div>
                        <div class="mt-3 text-muted small">
                            <span class="text-success fw-bold"><i class="bi bi-arrow-up-right"></i> +0.00%</span> <span th:text="#{inventory.raw.stat.since_last}">since last month</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Low Stock -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100" style="border-radius: 12px; border-left: 4px solid #dc3545 !important;">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted small mb-1 fw-semibold text-uppercase" th:text="#{inventory.raw.stat.low}">Low Stock Alerts</p>
                                <h3 class="mb-0 fw-bold text-dark" th:text="${lowStockCount}">0</h3>
                            </div>
                            <div class="bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-exclamation-triangle text-danger fs-4"></i>
                            </div>
                        </div>
                        <div class="mt-3 text-muted small">
                            <span th:text="#{inventory.raw.stat.low.desc}">Items with < 5 kg stock</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Today's Usages -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100" style="border-radius: 12px; border-left: 4px solid #198754 !important;">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <p class="text-muted small mb-1 fw-semibold text-uppercase" th:text="#{inventory.raw.stat.logs}">Logs Today</p>
                                <h3 class="mb-0 fw-bold text-dark" th:text="${todayUsages}">0</h3>
                            </div>
                            <div class="bg-success bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="bi bi-journal-check text-success fs-4"></i>
                            </div>
                        </div>
                        <div class="mt-3 text-muted small">
                            <span th:text="#{inventory.raw.stat.logs.desc}">Usage entries logged today</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── Search ── -->
        <div th:replace="~{fragments/search :: search(baseUrl='/inventory/raw-materials', keyword=${keyword}, size=${pageSize}, sort=${sort}, direction=${direction}, placeholder=#{inventory.raw.search.placeholder})}"></div>

        <!-- ── Main Table Card ── -->
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.raw.table.id}">ID</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.raw.table.name}">Item Name</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.raw.table.qty}">Total Quantity</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.raw.table.unit}">Unit</th>
                            <th class="border-0 px-4 py-3 text-muted small fw-bold text-uppercase" th:text="#{inventory.raw.table.updated}">Last Updated</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:if="${rawMaterialsPage.empty}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-2 d-block mb-2 text-secondary opacity-50"></i>
                                <span th:text="#{inventory.raw.table.empty}">No raw materials found in inventory.</span>
                            </td>
                        </tr>
                        <tr th:each="item : ${rawMaterialsPage.content}">
                            <td class="px-4 py-3">
                                <span class="fw-bold text-dark" th:text="${'#RM' + item.id}"></span>
                            </td>
                            <td class="px-4 py-3">
                                <div class="d-flex align-items-center">
                                    <div class="bg-secondary bg-opacity-10 rounded p-2 me-3 d-flex align-items-center justify-content-center">
                                        <i class="bi bi-basket2 text-secondary"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-bold text-dark" th:text="${item.itemName}">Chai Pati</h6>
                                    </div>
                                </div>
                            </td>
                            <td class="px-4 py-3">
                                <span class="badge" th:classappend="${item.totalQuantity < 5 ? 'bg-danger' : 'bg-success'}" th:text="${item.totalQuantity}"></span>
                            </td>
                            <td class="px-4 py-3">
                                <span class="badge bg-light text-dark border" th:text="${item.unit}">KG</span>
                            </td>
                            <td class="px-4 py-3 text-muted small">
                                <i class="bi bi-clock me-1"></i> <span th:text="${#temporals.format(item.updatedAt, 'dd-MM-yyyy HH:mm')}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${!rawMaterialsPage.empty}" class="card-footer bg-white border-0 py-3 px-4" style="border-radius: 0 0 12px 12px;">
                <div th:replace="~{fragments/pagination :: pagination(page=${rawMaterialsPage}, baseUrl='/inventory/raw-materials', query=${paginationQuery})}"></div>
            </div>
        </div>
    </div>
</body>
</html>
