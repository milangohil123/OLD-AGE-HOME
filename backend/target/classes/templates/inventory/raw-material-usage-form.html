<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/layout :: main(~{::#usage-form-container}, 'usage-logs', 'Log Daily Usage')}">

<body>
    <div id="usage-form-container">
        <!-- jQuery & Select2 -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <style>
            .select2-container .select2-selection--single {
                height: 38px !important;
                border: 1px solid #dee2e6 !important;
                border-radius: 0.375rem !important;
                display: flex;
                align-items: center;
            }
            .select2-container--default .select2-selection--single .select2-selection__arrow {
                height: 36px !important;
            }
            .select2-container--default .select2-selection--single .select2-selection__rendered {
                color: #212529 !important;
            }
        </style>
        <!-- ── Header ── -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/inventory/raw-materials/usage}" class="text-decoration-none text-muted small mb-2 d-inline-block">
                    <i class="bi bi-arrow-left"></i> Back to Usage History
                </a>
                <h4 class="mb-1 text-dark fw-bold" th:text="${pageTitle}">Log Daily Usage</h4>
                <p class="text-muted mb-0 small">Record consumption of raw materials</p>
            </div>
        </div>

        <!-- ── Form ── -->
        <div class="card border-0 shadow-sm" style="border-radius: 12px;">
            <div class="card-body p-4">
                <form th:action="@{/inventory/usage/save}" th:object="${usageForm}" method="post" id="usageForm">
                    
                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger shadow-sm border-0" style="border-radius: 12px;">
                        <ul class="mb-0">
                            <li th:each="err : ${#fields.detailedErrors()}" th:text="${err.message}"></li>
                        </ul>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-dark small">Usage Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{usageDate}" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('usageDate')}" th:errors="*{usageDate}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-dark small">Purpose <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{purpose}" required>
                                <option value="" disabled>Select Purpose...</option>
                                <option value="Breakfast">Breakfast</option>
                                <option value="Lunch">Lunch</option>
                                <option value="Dinner">Dinner</option>
                                <option value="Snacks/Tea">Snacks/Tea</option>
                                <option value="Special Event">Special Event</option>
                                <option value="General Use">General Use</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
                        </div>
                    </div>

                    <h5 class="fw-bold text-dark mb-3">Items Used</h5>
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle" id="itemsTable">
                            <thead class="bg-light">
                                <tr>
                                    <th class="text-muted small fw-bold text-uppercase">Raw Material</th>
                                    <th class="text-muted small fw-bold text-uppercase" style="width: 200px;">Quantity</th>
                                    <th class="text-muted small fw-bold text-uppercase" style="width: 150px;">Unit</th>
                                    <th class="text-center" style="width: 60px;"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, stat : *{items}" class="item-row">
                                    <td>
                                        <select class="form-select material-select" th:name="|items[${stat.index}].rawMaterialName|" required>
                                            <option value="" disabled selected>Select or type material...</option>
                                            <option th:each="rm : ${rawMaterials}" 
                                                    th:value="${rm.itemName}" 
                                                    th:text="${rm.itemName + ' (Donated: ' + rm.totalQuantity + ' ' + rm.unit + ')'}"
                                                    th:selected="${item.rawMaterialName == rm.itemName}">
                                            </option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" step="0.001" class="form-control" th:name="|items[${stat.index}].quantityUsed|" th:value="${item.quantityUsed}" placeholder="e.g. 1.5" required>
                                    </td>
                                    <td>
                                        <select class="form-select" th:name="|items[${stat.index}].unit|" required>
                                            <option value="KG" th:selected="${item.unit == 'KG'}">KG</option>
                                            <option value="GRAM" th:selected="${item.unit == 'GRAM'}">Gram</option>
                                            <option value="LITER" th:selected="${item.unit == 'LITER'}">Liter</option>
                                            <option value="ML" th:selected="${item.unit == 'ML'}">ML</option>
                                            <option value="UNIT" th:selected="${item.unit == 'UNIT'}">Unit/Piece</option>
                                        </select>
                                    </td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-outline-danger btn-sm rounded-circle remove-btn" onclick="removeRow(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="mb-4">
                        <button type="button" class="btn btn-outline-primary btn-sm fw-bold" onclick="addRow()">
                            <i class="bi bi-plus-lg me-1"></i> Add Another Item
                        </button>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/inventory}" class="btn btn-light ms-2 px-4 fw-medium text-secondary" style="border-radius: 8px;">Cancel</a>
                        <button type="submit" class="btn btn-success fw-bold px-4 shadow-sm">
                            <i class="bi bi-check-lg me-1"></i> Save Usage
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            // The raw materials list passed from controller
            const rawMaterialsList = /*[[${rawMaterials}]]*/ [];

            function initSelect2() {
                $('.material-select').select2({
                    tags: true,
                    placeholder: "Select or type material...",
                    width: '100%'
                });
            }

            $(document).ready(function() {
                initSelect2();
            });

            function addRow() {
                const tbody = document.querySelector('#itemsTable tbody');
                const rowCount = tbody.querySelectorAll('tr.item-row').length;
                
                const tr = document.createElement('tr');
                tr.className = 'item-row';
                
                let optionsHtml = '<option value="" disabled selected>Select or type material...</option>';
                rawMaterialsList.forEach(rm => {
                    optionsHtml += `<option value="${rm.itemName}">${rm.itemName} (Donated: ${rm.totalQuantity} ${rm.unit})</option>`;
                });

                tr.innerHTML = `
                    <td>
                        <select class="form-select material-select" name="items[${rowCount}].rawMaterialName" required>
                            ${optionsHtml}
                        </select>
                    </td>
                    <td>
                        <input type="number" step="0.001" class="form-control" name="items[${rowCount}].quantityUsed" placeholder="e.g. 1.5" required>
                    </td>
                    <td>
                        <select class="form-select" name="items[${rowCount}].unit" required>
                            <option value="KG">KG</option>
                            <option value="GRAM">Gram</option>
                            <option value="LITER">Liter</option>
                            <option value="ML">ML</option>
                            <option value="UNIT">Unit/Piece</option>
                        </select>
                    </td>
                    <td class="text-center">
                        <button type="button" class="btn btn-outline-danger btn-sm rounded-circle remove-btn" onclick="removeRow(this)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
                initSelect2();
            }

            function removeRow(btn) {
                const tbody = document.querySelector('#itemsTable tbody');
                if (tbody.querySelectorAll('tr.item-row').length > 1) {
                    // Destroy select2 on the row being removed to avoid memory leaks
                    $(btn).closest('tr').find('.material-select').select2('destroy');
                    btn.closest('tr').remove();
                    reindexRows();
                } else {
                    alert('You must log at least one item.');
                }
            }

            function reindexRows() {
                const rows = document.querySelectorAll('#itemsTable tbody tr.item-row');
                rows.forEach((row, index) => {
                    row.querySelector('select[name*=".rawMaterialName"]').name = `items[${index}].rawMaterialName`;
                    row.querySelector('input[name*=".quantityUsed"]').name = `items[${index}].quantityUsed`;
                    row.querySelector('select[name*=".unit"]').name = `items[${index}].unit`;
                });
            }
        </script>
    </div>
</body>
</html>
